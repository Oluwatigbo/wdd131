<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="description" content="Submit your review for our products.">
    <meta name="author" content="Oluwatigbo Alao">
    <link rel="stylesheet" href="styles/form-styles.css">
</head>
<body>
    <div class="container">
        <h1>Product Review Form</h1>
        <form id="reviewForm" method="get" action="review.html">
            <label for="productName">Product Name:</label>
            <select id="productName" name="productName" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <label>Overall Rating:</label>
            <div class="rating">
                <input type="radio" id="star1" name="rating" value="1" required>
                <label for="star1">☆</label>
                <input type="radio" id="star2" name="rating" value="2" required>
                <label for="star2">☆☆</label>
                <input type="radio" id="star3" name="rating" value="3" required>
                <label for="star3">☆☆☆</label>
                <input type="radio" id="star4" name="rating" value="4" required>
                <label for="star4">☆☆☆☆</label>
                <input type="radio" id="star5" name="rating" value="5" required>
                <label for="star5">☆☆☆☆☆</label>
            </div>

            <label for="installationDate">Date of Installation:</label>
            <input type="date" id="installationDate" name="installationDate" required>

            <label>Useful Features:</label>
            <div class="checkbox-group">
                <input type="checkbox" id="feature1" name="features" value="Feature 1">
                <label for="feature1">Feature 1</label>
                <input type="checkbox" id="feature2" name="features" value="Feature 2">
                <label for="feature2">Feature 2</label>
                <input type="checkbox" id="feature3" name="features" value="Feature 3">
                <label for="feature3">Feature 3</label>
                <input type="checkbox" id="feature4" name="features" value="Feature 4">
                <label for="feature4">Feature 4</label>
            </div>

            <label for="writtenReview">Written Review:</label>
            <textarea id="writtenReview" name="writtenReview"></textarea>

            <label for="userName">User  Name:</label>
            <input type="text" id="userName" name="userName">

            <input type="submit" value="Submit"/> 
        </form>
    </div>
     <footer>
        <p>&copy; <span id="year"></span> Oluwatigbo Alao, Nigeria.</p>
    </footer>
    <script src="scripts/formscript.js" defer></script> 
</body>
</html>
